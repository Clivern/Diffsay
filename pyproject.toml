[project]
name = "diffsay"
version = "0.2.0"
description = "Generate a conventional commit message from the staged git diff."
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["click>=8.1", "mlx-lm", "prompt-toolkit>=3"]

[project.scripts]
diffsay = "diffsay.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.8",
]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src"]

[tool.ruff.lint]
select = ["B", "E", "F", "I", "UP"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
